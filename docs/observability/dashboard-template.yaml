apiVersion: 1
providers:
  - name: codex-synaptic
    orgId: 1
    folder: Codex-Synaptic
    type: file
    disableDeletion: false
    options:
      path: ./dashboards

---
# Dashboard Panels
panels:
  - title: Swarm Execution Latency
    type: timeseries
    targets:
      - expr: codex_synaptic_swarm_execution_seconds
        legendFormat: "{{stage}}"
  - title: Consensus Vote Spread
    type: timeseries
    targets:
      - expr: codex_synaptic_consensus_votes_total
        legendFormat: "{{proposal}}"
  - title: Tree-of-Thought Backlog
    type: stat
    targets:
      - expr: codex_synaptic_tot_followups_pending
        legendFormat: pending
  - title: Agent Health
    type: table
    targets:
      - expr: codex_synaptic_agent_status
        legendFormat: "{{agent_type}}"
